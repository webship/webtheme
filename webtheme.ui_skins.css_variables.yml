# Webship.co design tokens on top of the UIkit ones, consumed by assets/css/tokens.css
# and assets/css/webship.css (generated from the
# UIkit CSS by scripts/build-tokens.mjs). Default values are the UIkit ones.

################################################################################
# Text colors.
################################################################################

uk-global-color:
  category: "Text colors"
  label: "Text color"
  type: "color"
  default_values:
    ":root": "#313637"

uk-global-emphasis-color:
  category: "Text colors"
  label: "Emphasis color (headings, active items)"
  type: "color"
  default_values:
    ":root": "#0d1214"

uk-global-muted-color:
  category: "Text colors"
  label: "Muted color"
  type: "color"
  default_values:
    ":root": "#7d919d"

uk-global-inverse-color:
  category: "Text colors"
  label: "Inverse color (text on colored backgrounds)"
  type: "color"
  default_values:
    ":root": "#ffffff"

uk-global-link-color:
  category: "Text colors"
  label: "Link color"
  type: "color"
  default_values:
    ":root": "#0c7fc8"

uk-global-link-hover-color:
  category: "Text colors"
  label: "Link hover color"
  type: "color"
  default_values:
    ":root": "#004e80"


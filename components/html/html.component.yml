$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: HTML document
status: stable
description: >
  Top-level <html> shell: <head> with the placeholder tokens, <body> with
  the modifier classes (user-logged-in, path-*, page-node-type-*) and the
  skip-link. Page content goes into the `page` slot.
props:
  type: object
  properties:
    html_attributes:
      type: Drupal\Core\Template\Attribute
    body_classes:
      type: array
      items:
        type: string
    head_title:
      type: array
      title: Head title parts
      description: List of strings safe-joined with " | " for the <title> tag.
    placeholder_token:
      type: string
    webtheme_path:
      type: string
      title: Webtheme path
      description: Used by the font-preload links.
    noscript_styles:
      type: [string, object]
slots:
  head_extra:
    title: Extra head markup
    description: Output before noscript_styles inside <head>.
  page_top:
    title: page_top
  page:
    title: page
  page_bottom:
    title: page_bottom

# Webship.co design tokens on top of the UIkit ones, consumed by
# assets/css/tokens.css (generated from the UIkit CSS by
# scripts/build-tokens.mjs). The defaults are the values of
# assets/css/webship.css (light) and assets/css/drupal.css (dark, the
# ':root[data-theme="dark"]' scope): they all reach the WCAG AAA contrast.
# Check the contrast again when changing them.
#
# The ids carry the theme name: the ids of UI Skins are shared by every theme
# of the site, and another theme (the administration theme, UI Suite UIkit)
# declares the UIkit names too. drupal.css maps each one to its UIkit name
# (webtheme-global-color to --uk-global-color).

################################################################################
# Text colors.
################################################################################

webtheme-global-color:
  category: "Text colors"
  label: "Text color"
  type: "ui_skins_alpha_color"
  default_values:
    ":root": "#313637ff"
    ':root[data-theme="dark"]': "#ffffffb3"

webtheme-global-emphasis-color:
  category: "Text colors"
  label: "Emphasis color (headings, active items)"
  type: "color"
  default_values:
    ":root": "#0d1214"
    ':root[data-theme="dark"]': "#ffffff"


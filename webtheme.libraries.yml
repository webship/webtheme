# UIkit framework. Loaded from the jsDelivr CDN by default; switch to a local
# copy in web/libraries/uikit from the theme settings (see README.md).
# The asset paths are rewritten in webtheme_library_info_alter().
uikit:
  remote: https://getuikit.com/
  version: 3.25.22
  license:
    name: MIT
    url: https://github.com/uikit/uikit/blob/develop/LICENSE.md
    gpl-compatible: true
  css:
    base:
      https://cdn.jsdelivr.net/npm/uikit@3.25.22/dist/css/uikit.min.css: { type: external, minified: true }
  js:
    https://cdn.jsdelivr.net/npm/uikit@3.25.22/dist/js/uikit.min.js: { type: external, minified: true }
    https://cdn.jsdelivr.net/npm/uikit@3.25.22/dist/js/uikit-icons.min.js: { type: external, minified: true }

# HTMX navigation: boosted links in the page wrapper, with Drupal core HTMX
# (assets, settings and behaviors of the swapped content). The exclusions,
# focus and announcement are rendered on the server, see HtmxNavigationHooks.
htmx:
  css:
    theme:
      assets/css/htmx.css: {}
  dependencies:
    - core/drupal.htmx

# Theme glue: the fonts served by the theme, the design tokens (CSS custom
# properties consumed by UI Skins), Drupal specific adjustments and the WCAG
# 2.2 AAA adjustments of UIkit.
base:
  css:
    theme:
      assets/css/fonts.css: {}
      assets/css/tokens.css: {}
      assets/css/webship.css: {}
      assets/css/drupal.css: {}
      assets/css/accessibility.css: {}
  js:
    assets/js/accessibility.js: {}
  dependencies:
    - core/drupal
    - core/once
    - webtheme/uikit

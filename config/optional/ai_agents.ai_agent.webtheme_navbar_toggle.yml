    description_override: ''
    progress_message: ''
    use_artifacts: 0
  'display_builder_ai:get_component_details':
    return_directly: 0
    description_override: ''
    progress_message: ''
    use_artifacts: 0
orchestration_agent: false
triage_agent: false
max_loops: 10

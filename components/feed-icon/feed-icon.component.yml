$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Feed icon
status: stable
description: >
  RSS feed link with a feed-icon SVG. Rendered as <a class="feed-icon">
  with a screen-reader label and the rss.svg image.
props:
  type: object
  properties:
    url:
      type: [string, "null"]
      title: Feed URL
    title:
      type: [string, "null"]
      title: Feed title
      default: 'RSS Feed'

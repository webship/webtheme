name: Link
description: "Define different styles for links."
group: Elements
links:
  - "https://getuikit.com/docs/link"
variants:
  default:
    title: Default
  muted:
    title: Muted
  text:
    title: Text
  heading:
    title: Heading
  reset:
    title: Reset
slots:
  label:
    title: Label
    description: "The text of the link."
props:
  type: object
  properties:
    hidden_suffix:
      title: "Hidden label suffix"
      description: "Text read by screen readers after the label, so that links with the same label (like \"Learn more\") tell where they lead."
      type: string
    url:
      title: URL
      $ref: "ui-patterns://url"
    new_window:
      title: "Open in a new window"
      type: boolean

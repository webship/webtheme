$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Menu local tasks
status: stable
description: >
  Primary + secondary admin tabs (Drupal's "local tasks"). Renders two
  <nav class="tabs-wrapper"> blocks, each carrying a screen-reader heading
  and a list with the .tabs / .tabs--primary / .tabs--secondary classes
  the live webship.co styles target. The data-drupal-nav-tabs hook is the
  JS handle used by core's tabs.js to collapse the wrapper into a drawer
  on narrow viewports.
slots:
  primary:
    title: Primary tabs
    description: Rendered <li> items for the primary tabs.
  secondary:
    title: Secondary tabs
    description: Rendered <li> items for the secondary tabs.

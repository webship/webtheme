$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Region
status: stable
description: >
  Generic region wrapper. Emits a div (or aside) with the
  region / region--{name} classes plus any modifier classes. The wrapper is
  a natural HTMX swap target (hx-target="#region-…") for partial updates.
props:
  type: object
  properties:
    region:
      type: [string, "null"]
      title: Region machine name
      description: Used to build the region--{name} class.
    wrapper:
      type: [string, "null"]
      title: Wrapper element
      description: HTML element used to wrap the region content.
      enum:
        - div
        - aside
      default: div
    modifier_classes:
      type: [array, "null"]
      title: Modifier classes
      description: Extra classes appended after region / region--{name}.
      items:
        type: [string, "null"]
slots:
  content:
    title: Content
    description: The region content, typically blocks.

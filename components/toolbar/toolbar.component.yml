$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Toolbar
status: stable
description: >
  Administrative toolbar with tabs and tray panels. Mirrors core's
  template_preprocess_toolbar variable contract.
props:
  type: object
  properties:
    toolbar_attributes:
      type: Drupal\Core\Template\Attribute
    toolbar_heading:
      type: [string, object, "null"]
    tabs:
      type: [array, "null"]
    trays:
      type: [array, "null"]
    remainder:
      type: [string, object, "null"]

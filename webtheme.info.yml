name: Webtheme
type: theme
description: 'The theme of the Webship.co portal site, generated from UI Suite UIkit: SDC components, UIkit and HTMX, with the Webship.co colors and design.'
package: Webship
core_version_requirement: '^11.4 || ^12'
'base theme': false
logo: logo.svg
dependencies:
  - 'ui_patterns:ui_patterns'
  - 'ui_skins:ui_skins'
  - 'ui_styles:ui_styles'
  - 'ui_icons:ui_icons_patterns'
regions:
  navbar_left: 'Navbar left'
  navbar_center: 'Navbar center'
  navbar_right: 'Navbar right'
  offcanvas: Offcanvas
  header: Header
  highlighted: Highlighted
  help: Help
  content: Content
  sidebar_first: 'Sidebar first'
  sidebar_second: 'Sidebar second'
  footer: Footer
  page_top: 'Page top'
  page_bottom: 'Page bottom'
libraries:
  - webtheme/uikit
  - webtheme/base
ckeditor5-stylesheets:
  - assets/css/ckeditor5.css
generator: 'ui_suite_uikit:unknown-version'
